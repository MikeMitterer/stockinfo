[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockinfo-source-us-example"
version = "0.1.0"
description = "Example StockInfo source plugin for a single US market"
license = "MIT"
requires-python = ">=3.11"

# The contract package, and nothing else. A plugin that reaches for the host's
# internals is not a plugin — it is a fork that happens to install.
#
# No HTTP library either: the example takes its transport as a constructor
# argument, which is what makes its tests run without a network.
dependencies = ["stockinfo-plugin-api>=0.2"]

[project.optional-dependencies]
testing = ["stockinfo-plugin-api[testing]>=0.2"]

# One source, announced once, usable in two roles. The host asks the class
# which roles it implements; the operator writes `UsExampleSource.name` on
# both lines in `sources.yaml`.
#
# The key below is only how the host *finds* the class — the name it registers
# comes from the class attribute. They are kept identical on purpose: a
# package that says one thing here and another there is a puzzle for whoever
# configures it.
#
# Do not repeat the class under another key. Its roles come from its base
# classes; a second entry only registers the same class `name` twice, which
# the loader reports as a duplicate before keeping the last registration.
[project.entry-points."stockinfo.sources"]
us-example = "stockinfo_source_us_example:UsExampleSource"

[tool.setuptools.packages.find]
where = ["src"]
