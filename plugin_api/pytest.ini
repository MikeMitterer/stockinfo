# Eigene pytest-Konfiguration, damit die Suite von überall läuft — aus
# `plugin_api/` wie aus dem Repository-Root über `make test`. Ohne die Pfade
# scheitert der Import: `stockinfo_plugin` liegt unter `src/`, die
# Beispiel-Plugins eine Ebene darüber.
[pytest]
testpaths = tests
pythonpath = src .
