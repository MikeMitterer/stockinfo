[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockinfo-plugin-api"
version = "1.0.0"
description = "Vertrag für StockInfo-Datenquellen-Plugins"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

# pytest ist nur für `stockinfo_plugin.testing` nötig — wer bloß ein Plugin
# schreibt und es nicht prüft, soll es nicht mitinstallieren müssen.
[project.optional-dependencies]
testing = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
