[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockinfo-plugin-api"
# 0.2 mit T-27a: Alle fünf Rollen stehen, dazu Invarianten, Szenarioformat und
# Doubles. Weiterhin 0.x mit Absicht — die Verträge haben noch kein einziges
# fremdes Plugin getragen, und **niemand hat sie je über eine Registry
# geladen**; das ist T-23. Eine 1.0 würde Stabilität behaupten, die sich noch
# nicht bewähren konnte.
version = "0.2.0"
description = "Vertrag für StockInfo-Datenquellen-Plugins"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

# pytest ist nur für `stockinfo_plugin.testing` nötig — wer bloß ein Plugin
# schreibt und es nicht prüft, soll es nicht mitinstallieren müssen.
[project.optional-dependencies]
testing = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
