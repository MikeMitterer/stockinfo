[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockinfo-plugin-api"
# Paketversion; unabhängig von API_VERSION und data_version.
version = "0.3.0"
description = "Vertrag für StockInfo-Datenquellen-Plugins"
license = "MIT"
requires-python = ">=3.11"
# PyYAML traegt das Beispiel-Plugin `yaml-file`. Ein Paket, das eine
# Bibliothek benutzt und nicht nennt, ist bei einer Fremdinstallation
# kaputt — und zwar erst beim ersten Laden, nicht beim Installieren.
dependencies = ["PyYAML>=6"]

# pytest ist nur für `stockinfo_plugin.testing` nötig — wer bloß ein Plugin
# schreibt und es nicht prüft, soll es nicht mitinstallieren müssen.
[project.optional-dependencies]
testing = ["pytest>=8"]

# Der **echte**, installierte Ladeweg. Die App findet diesen Resolver über
# `importlib.metadata`, ohne dass jemand eine Datei ins Datenvolume legt — und
# ohne dass dieses Repository ihn kennt. Ein Ladeweg, den man nur im Test
# nachstellt, ist keiner.
[project.entry-points."stockinfo.sources"]
yaml-file = "stockinfo_plugin_examples.yaml_file:YamlFileSource"

# Die Beispiele werden **mitinstalliert**, unter eigenem Paketnamen. Ohne das
# gäbe es keinen echten Entry-Point zum Vorführen: Ein Ladeweg, den man nur im
# Test nachstellt, ist keiner.
[tool.setuptools]
packages = [
    "stockinfo_plugin",
    "stockinfo_plugin.testing",
    "stockinfo_plugin_examples",
]

[tool.setuptools.package-dir]
stockinfo_plugin = "src/stockinfo_plugin"
"stockinfo_plugin.testing" = "src/stockinfo_plugin/testing"
stockinfo_plugin_examples = "examples"
