# Ergänzung für `compare_database_versions.py` (T-97).
#
# Hat der Arbeitsbestand weniger als 15 Papiere, nimmt der **alte** Stand
# diese Papiere über `POST /instruments/intake` in den gemeinsamen Snapshot
# auf, bevor er in die Vorher- und die Nachher-Kopie geteilt wird. Danach
# liest keine Instanz mehr aus dieser Datei; die Erwartungen des Browserwegs
# stammen aus den Antworten des alten Stands.
#
# Ausgewählt nach Vielfalt: Börsen und Währungen außerhalb von Xetra/EUR
# (NASDAQ/USD, SIX/CHF, LSE/GBP), ein zweites Paar, ein ETF und ein Fonds
# mit Details, ein ETC. Kurse sind Beispielwerte, keine Marktdaten.
