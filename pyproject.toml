[project]
name = "stockinfo"
version = "1.7.2"
description = "REST-Kursabfrage für Aktien und ETFs mit SQLite-Cache"
license = "EUPL-1.2"
requires-python = ">=3.14"

# Nur die Tests der App. `plugin_api/` ist ein eigenständiges Paket mit eigener
# Suite und eigenem Import-Pfad — ohne diese Grenze zieht pytest es mit ein und
# bricht beim Import ab, weil `stockinfo_plugin` hier nicht installiert ist.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Fragt einen fremden Dienst wirklich. Läuft im normalen Lauf mit — das
    # ist der Zweck —, lässt sich aber mit `-m "not integration"` abwählen,
    # wenn gerade kein Netz da ist.
    "integration: fragt eine echte, fremde API",
]

# Messbare Grenzen (T-144, Entscheidung q-11): Sie brechen `make check` über
# `make quality`. Die Zahlen stehen nur hier; ruff und pylint lesen sie beide.
# Gilt auch für `plugin_api/`, dessen pyproject.toml keinen ruff-Abschnitt hat.
# Die Zielversion liest ruff aus `requires-python`; eine eigene steht hier nicht.

[tool.ruff.lint]
# Zu den Vorgaben (E4, E7, E9, F): Komplexität (C901), Rückgaben, Zweige,
# Argumente und Anweisungen je Funktion (PLR09) sowie Vereinfachungen (SIM, RET).
# Eine begründete Ausnahme steht je Zeile: `# noqa: PLR0913 - Grund`.
extend-select = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "SIM", "RET"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 15
max-returns = 6
max-statements = 60

[tool.ruff.lint.per-file-ignores]
# Ein Test darf ein langer Ablauf sein, und pytest-Fixtures kommen als
# Parameter; die Grenzen je Funktion gelten für App, Skripte und Plugin-API.
"tests/**" = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "SIM", "RET"]
"plugin_api/tests/**" = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "SIM", "RET"]

[tool.pylint.format]
max-module-lines = 1000

[tool.pylint.similarities]
min-similarity-lines = 8
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
