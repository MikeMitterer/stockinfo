[project]
name = "stockinfo"
version = "1.1.0"
description = "REST-Kursabfrage für Aktien und ETFs mit SQLite-Cache"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"

# Nur die Tests der App. `plugin_api/` ist ein eigenständiges Paket mit eigener
# Suite und eigenem Import-Pfad — ohne diese Grenze zieht pytest es mit ein und
# bricht beim Import ab, weil `stockinfo_plugin` hier nicht installiert ist.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Fragt einen fremden Dienst wirklich. Läuft im normalen Lauf mit — das
    # ist der Zweck —, lässt sich aber mit `-m "not integration"` abwählen,
    # wenn gerade kein Netz da ist.
    "integration: fragt eine echte, fremde API",
]
