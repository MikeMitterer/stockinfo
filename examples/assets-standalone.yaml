version: 1

# Vorlage: die Datei einer Instanz, die **nur** aus ihr lebt.
#
# Hier ist Vollständigkeit die Zusage: Was nicht darinsteht, kennt diese
# Instanz nicht. Alle fünf Rollen werden aus dieser einen Datei bedient —
# Auflösung, Kurs, Tagesreihe, Metadaten und Devisen.
#
# Für den anderen Fall — die Datei **hinter** einer Online-Kette — ist
# `assets-fallback.yaml` die Vorlage. Dort ist Kürze die Zusage, und der
# Unterschied ist keine Ordnungsfrage: Ein Papier, das online beantwortet
# wird, führt in einer Fallback-Datei bei jeder Störung zu einem alten Kurs
# statt zu einem ehrlichen Ausfall.
#
# StockInfo speichert jeden übernommenen Kurs und Verlaufspunkt in seiner
# Datenbank. `history` ist optional und als von Hand gepflegter Rückfall für
# Papiere gedacht, die keine Quelle abfragen kann; fehlt `price`, springt der
# jüngste Schlusskurs als aktueller Kurs ein.
