<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!--
    Das Zeichen der App: vier aufsteigende Balken auf der Marken-Kachel.

    Gerechnet fuer 16 Pixel, nicht fuer 48. Die frühere Fassung trug
    Candlesticks, eine Trendlinie, eine Pfeilspitze und drei Datenpunkte —
    im Browser-Reiter lief das zu einer Flaeche zusammen, und die Balken mit
    22 Prozent Deckkraft waren dort gar nicht zu sehen.

    Dieselbe Form steht als Plakette in der Kopfzeile; dort liefert die Kachel
    das Fundament, hier gehoert sie zur Datei.

    Nur Formen, kein Text: Ein SVG, das ueber link rel=icon hereinkommt, ist
    ein eigenes Dokument und sieht weder die Schriften der Seite noch ihre
    Variablen.
  -->
  <defs>
    <linearGradient id="marke" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#812c7c"/>
      <stop offset="1" stop-color="#df5430"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#marke)"/>

  <!-- Vier Balken, Luecken von 4 Einheiten: bei 16 px sind das gut 1,3 Pixel. -->
  <g fill="#ffffff">
    <rect x="10" y="30" width="6" height="9" rx="2"/>
    <rect x="20" y="23" width="6" height="16" rx="2"/>
    <rect x="30" y="16" width="6" height="23" rx="2"/>
  </g>
</svg>
